services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mariadb
      DB_NAME: booking
      DB_USER: booking
      DB_PASSWORD: booking
      WEBHOOK_SECRET: change-me
    depends_on:
      mariadb:
        condition: service_healthy

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: booking
      MARIADB_USER: booking
      MARIADB_PASSWORD: booking
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./docker/mariadb/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./docker/mariadb/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20
